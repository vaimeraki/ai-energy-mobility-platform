version: '3.8'

# Local dev lakehouse only. Values come from .env (see .env.example) so
# credentials aren't hardcoded here; defaults below match .env.example
# for anyone who runs this without copying .env first.

services:
  minio:
    image: minio/minio:latest
    container_name: aem-minio
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change_me}
      - MINIO_DOMAIN=localhost
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aem-postgres
    ports:
      - "5433:5432"   # host 5433 -> avoids clashing with a locally-installed Postgres on 5432
    environment:
      - POSTGRES_DB=aem_platform
      - POSTGRES_USER=aem_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aem_user -d aem_platform"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aem-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-change_me}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  minio_data:
  postgres_data:
  pgadmin_data:

networks:
  default:
    name: aem-network
