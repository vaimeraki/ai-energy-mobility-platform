name: ai-em
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11
  
  # Data Engineering Core
  - apache-spark=3.5
  - pandas=2.1
  - numpy=1.24
  - pyarrow=12.0
  
  # Cloud & Storage (Multi-cloud compatible)
  - google-cloud-storage=2.10
  - google-cloud-bigquery=3.11
  - google-cloud-pubsub=2.18
  - gcsfs=2023.10
  - boto3=1.34.0
  - pip:
    - scaleway-sdk==2.14.0
  
  # Orchestration
  - apache-airflow=2.7
  - celery=5.3
  - redis=5.0
  
  # Analytics & Transformation
  - dbt-core=1.6
  - dbt-bigquery=1.6
  - sqlalchemy=2.0
  
  # Streaming & Real-time
  - kafka-python=2.0
  - confluent-kafka=2.3
  
  # ML & AI
  - scikit-learn=1.3
  - transformers=4.35
  - torch=2.1
  - langchain=0.0.350
  
  # Monitoring & Observability
  - prometheus-client=0.18
  - grafana-api=1.0.3
  - structlog=23.2
  
  # Testing & Quality
  - pytest=7.4
  - pytest-cov=4.1
  - black=23.10
  - flake8=6.1
  - mypy=1.7
  
  # DevOps & Utilities
  - docker-py=6.1
  - kubernetes=28.1
  - terraform=1.6
  - jinja2=3.1
  - pyyaml=6.0
  
  # Development
  - jupyter=1.0
  - ipykernel=6.26
  - notebook=7.0
  
  # French Data Sources
  - requests=2.31
  - beautifulsoup4=4.12
  - lxml=4.9
  
  - pip
  - pip:
    # Additional PyPI packages
    - great-expectations==0.18.5
    - mage-ai==0.8.70
    - prefect==2.14.0
    - dagster==1.6.0
